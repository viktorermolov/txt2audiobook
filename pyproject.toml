[tool.poetry]
name = "txt2audiobook"
version = "0.2.0"
description = "TXT ➜ русская аудиокнига (XTTS v2)"
authors = ["Viktor"]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
TTS = "^0.22.0"          # нужна ≥0.21 для xtts_v2   [oai_citation:8‡Coqui AI Documentation](https://docs.coqui.ai/en/latest/models/xtts.html?utm_source=chatgpt.com)
pydub = "^0.25.1"
mutagen = "^1.47.0"
torch = ">=2.2,<2.9"
transformers = "<4.50"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
txt2audiobook = "txt2audiobook.cli:main"
